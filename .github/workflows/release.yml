name: Release ClickGit

on:
  push:
    tags:
      - "release-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: scripts/bootstrap.ps1

      - name: Download PortableGit
        shell: pwsh
        run: scripts/download-portable-git.ps1

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Resolve release version
        shell: pwsh
        env:
          RELEASE_INPUT: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $ReleaseVersion = $env:RELEASE_INPUT
          }
          else {
            $ReleaseVersion = $env:GITHUB_REF_NAME -replace "^release-v", ""
          }
          $ReleaseVersion = $ReleaseVersion -replace "-retry.*$", ""
          "RELEASE_VERSION=$ReleaseVersion" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and package Windows products
        shell: pwsh
        run: scripts/package.ps1 -Version $env:RELEASE_VERSION

      - name: Stage Windows release assets
        shell: pwsh
        run: |
          $ReleaseDirectory = "artifacts\release\windows-x64"
          if (Test-Path -LiteralPath $ReleaseDirectory) {
            Remove-Item -LiteralPath $ReleaseDirectory -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $ReleaseDirectory |
            Out-Null
          Copy-Item -LiteralPath "artifacts\installer\ClickGit-Windows-x64-Setup.exe" -Destination $ReleaseDirectory
          Copy-Item -LiteralPath "artifacts\package\ClickGit-Windows-x64-Portable.zip" -Destination $ReleaseDirectory

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/release/windows-x64
          if-no-files-found: error

  macos:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-15
            python_arch: arm64
            artifact: macos-arm64
            archive: ClickGit-macOS-arm64.zip
          - label: macOS Intel
            runner: macos-15-intel
            python_arch: x64
            artifact: macos-x64
            archive: ClickGit-macOS-x64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}
          cache: pip

      - name: Install build dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Build, test and verify macOS package
        run: |
          chmod +x scripts/build-macos.sh scripts/verify-macos.sh
          PYTHON_BIN=python3 scripts/build-macos.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/package/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish Windows and macOS releases
    needs:
      - windows-x64
      - macos
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create releases and upload assets
        shell: bash
        env:
          RELEASE_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local tag="$1"
            local object_type
            local object_sha
            local depth=0

            read -r object_type object_sha < <(
              gh api "repos/${GH_REPO}/git/ref/tags/${tag}" \
                --jq '.object | [.type, .sha] | @tsv'
            )
            while [[ "$object_type" == "tag" ]]; do
              ((depth += 1))
              if (( depth > 16 )); then
                echo "Tag ${tag} has too many annotation levels." >&2
                return 1
              fi
              read -r object_type object_sha < <(
                gh api "repos/${GH_REPO}/git/tags/${object_sha}" \
                  --jq '.object | [.type, .sha] | @tsv'
              )
            done
            if [[ "$object_type" != "commit" ]]; then
              echo "Tag ${tag} resolves to unsupported type ${object_type}." >&2
              return 1
            fi
            printf '%s\n' "$object_sha"
          }

          assert_release_tag_target() {
            local tag="$1"
            local resolved_sha

            resolved_sha="$(resolve_tag_commit "$tag")"
            if [[ "$resolved_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag ${tag} targets ${resolved_sha}, expected ${GITHUB_SHA}." >&2
              return 1
            fi
          }

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$RELEASE_INPUT"
          else
            VERSION="${GITHUB_REF_NAME#release-v}"
          fi
          VERSION="${VERSION%%-retry*}"
          WINDOWS_TAG="windows-v${VERSION}"
          MAC_TAG="mac-v${VERSION}"
          WINDOWS_SETUP="release-assets/windows-x64/ClickGit-Windows-x64-Setup.exe"
          WINDOWS_PORTABLE="release-assets/windows-x64/ClickGit-Windows-x64-Portable.zip"
          MAC_ARM_ASSET="release-assets/macos-arm64/ClickGit-macOS-arm64.zip"
          MAC_X64_ASSET="release-assets/macos-x64/ClickGit-macOS-x64.zip"

          test -f "$WINDOWS_SETUP"
          test -f "$WINDOWS_PORTABLE"
          test -f "$MAC_ARM_ASSET"
          test -f "$MAC_X64_ASSET"

          if gh release view "$WINDOWS_TAG" >/dev/null 2>&1; then
            assert_release_tag_target "$WINDOWS_TAG"
          else
            if gh api "repos/${GH_REPO}/git/ref/tags/${WINDOWS_TAG}" >/dev/null 2>&1; then
              assert_release_tag_target "$WINDOWS_TAG"
            fi
            gh release create "$WINDOWS_TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "ClickGit Windows v${VERSION}" \
              --notes "Windows x64 安装版优先使用；便携版作为免安装备用。"
          fi
          if gh release view "$MAC_TAG" >/dev/null 2>&1; then
            assert_release_tag_target "$MAC_TAG"
          else
            if gh api "repos/${GH_REPO}/git/ref/tags/${MAC_TAG}" >/dev/null 2>&1; then
              assert_release_tag_target "$MAC_TAG"
            fi
            gh release create "$MAC_TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "ClickGit macOS v${VERSION}" \
              --notes "macOS 版本包含 Apple Silicon 与 Intel 两个安装包。"
          fi

          gh release upload "$WINDOWS_TAG" \
            "$WINDOWS_SETUP" \
            "$WINDOWS_PORTABLE" \
            --clobber
          gh release upload "$MAC_TAG" \
            "$MAC_ARM_ASSET" \
            "$MAC_X64_ASSET" \
            --clobber

          gh release edit "$WINDOWS_TAG" --draft=false
          gh release edit "$MAC_TAG" --draft=false
